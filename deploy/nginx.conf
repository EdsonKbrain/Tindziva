# Nginx site for Tindziva. provision.sh replaces "tindziva.co.mz" with the real domain,
# then Certbot adds the HTTPS server block and the HTTP → HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name tindziva.co.mz www.tindziva.co.mz;
    root /var/www/tindziva/public;
    index index.php;

    client_max_body_size 64M;
    charset utf-8;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~* ^/(build|images)/.*\.(?:css|js|woff2?|png|jpe?g|webp|gif|ico|svg)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /storage/ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        location ~ \.php$ { deny all; }
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/tindziva.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Never serve dotfiles such as .env or .git.
    location ~ /\.(?!well-known).* { deny all; }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
